# ===== Hermes 远程访问 nginx vhost 模板 =====
# 放 /etc/nginx/sites-available/YOUR_DOMAIN.conf 并 symlink 到 sites-enabled
# 替换 YOUR_DOMAIN 为你的域名。

server {
    listen 80;
    server_name YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # certbot 签发
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 反代到 frp 隧道入口(127.0.0.1:18787)
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级(HTTPS 下的 wss 反代必需)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:18787;
    }
}